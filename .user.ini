; Límites PHP para el formulario con fotos (PHP-FPM / CGI lee este archivo; con mod_php se ignora sin error).
; mail.php acepta hasta 6 archivos de 10 MB; el navegador comprime las fotos antes de enviarlas.
upload_max_filesize = 12M
post_max_size = 64M
max_file_uploads = 10
max_execution_time = 60
memory_limit = 256M
